services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: gymos2
      POSTGRES_PASSWORD: "${GYMOS_DEV_DB_PASSWORD:?set to the development database password from config/passwords.yaml}"
    volumes:
      - gymos2_data:/var/lib/postgresql/data


  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: gymos2_test
      POSTGRES_PASSWORD: "${GYMOS_TEST_DB_PASSWORD:?set to the test database password from config/passwords.yaml}"
    volumes:
      - gymos2_test_data:/var/lib/postgresql/data


volumes:
  gymos2_data:
  gymos2_test_data:
