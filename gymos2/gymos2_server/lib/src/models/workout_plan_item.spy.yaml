  exerciseId: int, relation(parent=exercise)
  orderIndex: int
  targetSets: int
  targetRepsText: String
  suggestedWeight: double?
  restSeconds: int
  rationale: String
indexes:
  workout_plan_item_lookup:
    fields: planId
